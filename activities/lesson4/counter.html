<!doctype html>
<html>
  <head>
    <title>Counter</title>
    <style>
      body {
        background-color: rgb(222, 222, 222);
        font-family: Arial;
        height: 100vh;
        margin: 0;
      }

      .buttons-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        height: 100vh;
      }

      .button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 2px;
        padding: 10px 15px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="../../scripts/react.js"></script>
    <script src="../../scripts/react-dom.js"></script>

    <script src="../../scripts/chatbot.js"></script>

    <script src="../../scripts/babel.js"></script>
    <script type="text/babel">
      // 3f
      function Reset({ setCount }) {
        function reset() {
          setCount(0);
          // console.log("reset");
        }
        return (
          <button onClick={reset} className="button">
            Reset
          </button>
        );
      }

      function App() {
        // 3b
        // 3e
        const [count, setCount] = React.useState(0);

        const checkCount = count === 1 ? "time" : "times";

        function increment() {
          setCount(count + 1);
        }

        // getting the main click button
        const [isAuto, setIsAuto] = React.useState(true);
        const buttonRef = React.useRef(null);

        function runAuto() {
          console.log(isAuto);

          if (isAuto) {
            autoClick();
          }

          setIsAuto(!isAuto);
        }

        function autoClick() {
          const buttonElem = buttonRef.current;
          setInterval(() => {
            buttonElem.click();
          }, 1000);
        }

        return (
          <div className="buttons-container">
            <button onClick={increment} ref={buttonRef} className="button">
              Clicked {count} {checkCount}
            </button>

            <Reset setCount={setCount} />

            <button onClick={runAuto} className="button">
              Auto Click
            </button>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
