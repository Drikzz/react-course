<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <div class="js-container"></div>

  <script src="../../scripts/react.js"></script>
  <script src="../../scripts/react-dom.js"></script>

  <script src="../../scripts/babel.js"></script>
  <script type="text/babel">
    
    function ProductDetails({name, price, discountPrice, imageSrc}) {
      // console.log(imageSrc);
      // 2i
      const checkPrice = discountPrice ? 
        <div>
          <del><p>${Number(price)}</p></del>
          <p>Discount Price: ${Number(price) - Number(discountPrice)}</p>
        </div> :
        <p>${Number(price)}</p>;

      return(

        // 2e
        <>
        <div>
          {imageSrc && (
            <img src={`./${imageSrc}.png`} width="50" alt="{imageSrc}"/>
          )}
          <p>{name}</p>
          
          {checkPrice};
          <button>Add to cart</button>
        </div>
        </>
      );
    }

    function App() {
      return(
        // 2f
        <div>
          <ProductDetails name="Cotton Socks" price="10.90" discountPrice="5.45" imageSrc="cotton-socks" /> 
          <ProductDetails name="Tennis balls" price="6.00" imageSrc="tennis-balls" /> 
          <ProductDetails name="Plain T-Shirt" price="7.99" imageSrc="plain-t-shirt" /> 
        </div>
        
      ); 
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);
  </script>
</body>
</html>
